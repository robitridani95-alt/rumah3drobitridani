<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sketsa AR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#d9d6e6;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#efeaf7,#cfd6ea)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(140,130,185,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:0}
#back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;padding:5px 12px;border-radius:14px;font-size:12px;z-index:5}
#bar{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);max-height:calc(100% - 190px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;z-index:5}
#bar button{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.25);color:#fff;border:0;display:grid;place-items:center;padding:0}
#bar button:active{background:rgba(255,255,255,.5)}
#bar button.on{background:#fff}#bar button.on svg{fill:#4a63d8}
#bar svg{width:18px;height:18px;fill:#fff}
#joy{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:112px;padding:8px 8px 6px;border-radius:20px;z-index:5;touch-action:none}
#pad{position:relative;width:96px;height:96px;border-radius:50%;background:rgba(40,35,80,.35);margin:0 auto}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#deg{text-align:center;font-size:9px;margin-top:5px;letter-spacing:.4px}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);transform:translateX(-50%);padding:7px 16px;border-radius:14px;font-size:13px;z-index:5;max-width:90vw;text-align:center}
#pal{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;padding:9px 12px;border-radius:18px;z-index:5;width:min(92vw,232px)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.85);flex:none;padding:0}
.sw.on{transform:scale(1.22);box-shadow:0 0 0 2px #4a63d8}
#psize{flex:1 0 100%}
#sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,340px);padding:16px;border-radius:22px;z-index:12;font-size:13px}
#sheet b{display:block;font-size:12px;letter-spacing:.5px;opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:0;border-radius:14px;padding:8px 13px;font-size:13px;background:rgba(255,255,255,.28);color:#fff}
.chip.on{background:#fff;color:#4a63d8;font-weight:600}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#f5f1ff,#c8d0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#2a2f5e}
#start h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}
#start p{margin:0 0 26px;max-width:310px;font-size:14px;line-height:1.5;opacity:.8}
#start button{padding:14px 40px;border:0;border-radius:28px;background:#4a63d8;color:#fff;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(74,99,216,.4)}
#err{margin-top:16px;font-size:12px;color:#b3261e;max-width:300px}
.hide{display:none!important}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<button id="back" class="glass">‹ Ulang</button>
<div id="bar" class="glass">
  <button id="bRelocate" title="Pindah lokasi"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></button>
  <button id="bPick" title="Pilih rumah & pemandangan"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
  <button id="bBucket" class="on" title="Gesek untuk mewarnai"><svg viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15a1.49 1.49 0 0 0 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></svg></button>
  <button id="bPen" title="Pena bebas"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
  <button id="bAuto" title="Warnai otomatis"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4c2.8 0 5-2.2 5-5 0-4.4-4-7.4-9-7.4zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></button>
  <button id="bUndo" title="Urungkan"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.96 7.96 0 0 1 12.5 10c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 10.67 17.19 8 12.5 8z"/></svg></button>
  <button id="bClear" title="Hapus semua warna"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
</div>
<div id="pal" class="glass hide"><input id="psize" class="hide" type="range" min="4" max="40" value="12" title="Ukuran pena"></div>
<div id="sheet" class="glass hide">
  <b>PILIH RUMAH</b><div id="hs" class="chips"></div>
  <b>PEMANDANGAN 3D</b><div id="ss" class="chips"></div>
  <button id="sClose" class="chip on">Selesai</button>
</div>
<div id="joy" class="glass">
  <div id="pad"><div id="knob"></div></div>
  <div id="deg">0° 0°</div>
</div>
<div id="hint" class="glass">Ketuk layar untuk menaruh lokasi</div>

<div id="start">
  <h1>SKETSA AR</h1>
  <p>Buku mewarnai 3D di ruangan Anda. Garisnya sudah ada: pilih rumah dan pemandangan, pilih warna, lalu gesek layar untuk mewarnai.</p>
  <button id="go">Mulai</button>
  <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const rad=d=>d*Math.PI/180, clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,.05,100);
scene.add(camera);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- dasar model ---------- */
const root=new THREE.Group();root.visible=false;scene.add(root);
let P=null;                       // bagian (part) yang sedang dibangun
const parts=[];
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const J=a=>(rnd()-.5)*2*a;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const lineMat=new THREE.LineBasicMaterial({color:0x23233a});
const C={white:0xf7f5ff,blue:0x8d9df3,dblue:0x3f58d6,red:0xdc4a2c,dred:0xa83520,green:0x5fb83e,win:0x2c43c0,
  sky:0x9bd3ff,wood:0x9a6a45,cream:0xf6efe0,brick:0xb5523b,gray:0x8e8ea6,stone:0xc9c4d6,yel:0xf2c94c,thatch:0xc9a24a,rock:0x8a7f9c};
const DRAW_T=2.4;

function newPart(name){
  P={name,g:new THREE.Group(),strokes:[],fills:[],on:false,animated:false,drawing:false,t0:0};
  P.g.visible=false;root.add(P.g);parts.push(P);return P;
}
function sched(p){
  const N=p.strokes.length;
  p.strokes.forEach((s,i)=>{s.start=Math.max(0,(i/N)*(DRAW_T-.8)+J(.1));s.dur=.5+rnd()*.5});
}
// region warna: material transparan, opacity 0 = belum diwarnai
const fm=c=>{
  const m=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  m.userData.def=c;return m;
};
function addFill(m){m.visible=false;P.g.add(m);P.fills.push(m)}

function polyline(pts,jit=.01,seg=8){
  const o=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],n=Math.max(2,Math.round(a.distanceTo(b)*seg));
    for(let k=i?1:0;k<=n;k++){const t=k/n;o.push(a.x+(b.x-a.x)*t+J(jit),a.y+(b.y-a.y)*t+J(jit),a.z+(b.z-a.z)*t+J(jit))}
  }
  return o;
}
function addStroke(flat){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
  g.setDrawRange(0,0);
  const l=new THREE.Line(g,lineMat);l.frustumCulled=false;P.g.add(l);
  P.strokes.push({g,line:l,n:flat.length/3,start:0,dur:1});
}
function edge(a,b){
  const d=b.clone().sub(a).normalize().multiplyScalar(.03);
  addStroke(polyline([a.clone().sub(d),b.clone().add(d)],.007));
  if(rnd()<.5)addStroke(polyline([a.clone().add(d.clone().multiplyScalar(-.4)),b.clone().sub(d.clone().multiplyScalar(.3))],.011));
}
function outline(pts){for(let i=0;i<pts.length;i++)edge(pts[i],pts[(i+1)%pts.length])}
function ring(cx,y,cz,r,n=22){
  const pts=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;pts.push(V(cx+Math.cos(a)*r,y,cz+Math.sin(a)*r))}
  addStroke(polyline(pts,Math.min(.012,r*.08),10));
}

function box(cx,cy,cz,w,h,d,cols,opt={}){
  if(typeof cols==='number')cols=Array(6).fill(cols);
  const x0=cx-w/2,x1=cx+w/2,y0=cy,y1=cy+h,z0=cz-d/2,z1=cz+d/2;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),cols.map(fm));
  m.position.set(cx,cy+h/2,cz);addFill(m);
  const c=[V(x0,y0,z0),V(x1,y0,z0),V(x1,y0,z1),V(x0,y0,z1),V(x0,y1,z0),V(x1,y1,z0),V(x1,y1,z1),V(x0,y1,z1)];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>edge(c[a],c[b]));
  const hat=opt.hatch===undefined?Math.floor(h*4):opt.hatch;
  for(let i=0;i<hat;i++){
    const y=y0+.05+rnd()*h*.85,za=z0+d*(.1+rnd()*.25),zb=z1-d*(.1+rnd()*.25);
    addStroke(polyline([V(x1,y,za),V(x1,y+.1,zb)],.004,4));
  }
}
function poly(color,pts,fill=true){
  if(fill){
    const g=new THREE.BufferGeometry(),v=[];
    for(let i=1;i<pts.length-1;i++)[pts[0],pts[i],pts[i+1]].forEach(p=>v.push(p.x,p.y,p.z));
    g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
    addFill(new THREE.Mesh(g,fm(color)));
  }
  outline(pts);
}
function rectF(x0,x1,y0,y1,z,color){poly(color,[V(x0,y0,z),V(x1,y0,z),V(x1,y1,z),V(x0,y1,z)])}
function winFront(cx,cy,z,w,h,color=C.win){
  rectF(cx-w/2,cx+w/2,cy-h/2,cy+h/2,z,color);
  addStroke(polyline([V(cx,cy-h/2,z+.003),V(cx,cy+h/2,z+.003)],.003,6));
  addStroke(polyline([V(cx-w/2,cy,z+.003),V(cx+w/2,cy,z+.003)],.003,6));
}
function disc(cx,cy,cz,r,color,flat=false){
  const m=new THREE.Mesh(new THREE.CircleGeometry(r,26),fm(color));
  if(flat)m.rotation.x=-Math.PI/2;
  m.position.set(cx,cy,cz);addFill(m);
  if(flat)ring(cx,cy+.002,cz,r,26);
  else{const pts=[];for(let i=0;i<=26;i++){const a=i/26*Math.PI*2;pts.push(V(cx+Math.cos(a)*r,cy+Math.sin(a)*r,cz+.002))}addStroke(polyline(pts,Math.min(.012,r*.06),10))}
}
function cyl(cx,y0,cz,rT,rB,h,color,seg=10){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,h,seg),fm(color));
  m.position.set(cx,y0+h/2,cz);addFill(m);
  ring(cx,y0,cz,rB);ring(cx,y0+h,cz,rT);
  for(let i=0;i<4;i++){const a=i*Math.PI/2+.4;addStroke(polyline([V(cx+Math.cos(a)*rB,y0,cz+Math.sin(a)*rB),V(cx+Math.cos(a)*rT,y0+h,cz+Math.sin(a)*rT)],.005,6))}
}
function cone(cx,y0,cz,r,h,color,seg=9){
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),fm(color));
  m.position.set(cx,y0+h/2,cz);addFill(m);
  ring(cx,y0,cz,r,seg*3);
  for(let i=0;i<5;i++){const a=i*Math.PI*2/5+.3;addStroke(polyline([V(cx,y0+h,cz),V(cx+Math.cos(a)*r,y0,cz+Math.sin(a)*r)],.008,7))}
}
function blob(x,y,z,r,color,loops=3){
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),fm(color));
  m.position.set(x,y+r*.8,z);addFill(m);
  for(let k=0;k<loops;k++){
    const pts=[],ph=rnd()*6;
    for(let i=0;i<=16;i++){const a=ph+i/16*Math.PI*2*1.1;pts.push(V(x+Math.cos(a)*r*(.6+k*.2),y+r*.8+Math.sin(a*.7+k)*r*.5,z+Math.sin(a)*r*(.6+k*.2)))}
    addStroke(polyline(pts,Math.min(.01,r*.1),10));
  }
}
function wire(a,b,sag=.18){
  const pts=[];for(let i=0;i<=14;i++){const t=i/14;pts.push(V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t-Math.sin(Math.PI*t)*sag,a.z+(b.z-a.z)*t))}
  addStroke(polyline(pts,.004,3));
}
function scribbles(n,rmin,rmax){
  for(let i=0;i<n;i++){
    const a=rnd()*Math.PI*2,r=rmin+rnd()*(rmax-rmin),l=.3+rnd()*.6;
    addStroke(polyline([V(Math.cos(a)*r,.005,Math.sin(a)*r),V(Math.cos(a+l/r)*r,.005,Math.sin(a+l/r)*r)],.02,5));
  }
}
function gableRoof(x0,x1,y,z0,z1,rh,front,back,gl,gr){
  const A=V(x0,y,z0),B=V(x1,y,z0),Cc=V(x1,y,z1),D=V(x0,y,z1),R0=V(x0,y+rh,(z0+z1)/2),R1=V(x1,y+rh,(z0+z1)/2);
  poly(front,[D,Cc,R1,R0]);poly(back,[B,A,R0,R1]);poly(gl,[A,D,R0]);poly(gr,[Cc,B,R1]);
}

/* ---------- rumah ---------- */
function houseTower(){
  newPart('Menara Biru');
  box(0,0,0,1.0,2.1,.9,[C.blue,C.white,C.white,C.white,C.white,C.white],{hatch:12});
  gableRoof(-.6,.6,2.1,-.55,.55,.55,C.red,C.dred,C.white,C.blue);
  disc(0,1.72,.452,.17,C.win);
  winFront(-.22,1.1,.452,.2,.34);winFront(.2,1.1,.452,.2,.34);winFront(0,.55,.452,.22,.28);
  [1.6,1.0,.45].forEach((yy,i)=>{const cz=i%2?-.15:.15;poly(C.win,[V(.502,yy-.15,cz-.1),V(.502,yy-.15,cz+.1),V(.502,yy+.15,cz+.1),V(.502,yy+.15,cz-.1)])});
  box(-1.0,0,.15,.9,1.0,.8,C.white,{hatch:3});
  poly(C.red,[V(-1.55,1.0,-.3),V(-.5,1.32,-.3),V(-.5,1.32,.6),V(-1.55,1.0,.6)]);
  rectF(-1.2,-.8,.01,.9,.552,C.stone);
  box(1.0,0,.2,.9,.75,.8,[C.blue,C.white,C.white,C.white,C.white,C.white],{hatch:3});
  poly(C.red,[V(.5,.75,-.25),V(1.55,.95,-.25),V(1.55,.95,.65),V(.5,.75,.65)]);
  poly(C.dred,[V(.6,.5,.62),V(1.4,.5,.62),V(1.4,.62,.85),V(.6,.62,.85)]);
  box(0,1.45,.62,.9,.05,.3,C.dblue,{hatch:0});
  blob(-.25,1.5,.68,.14,C.green);blob(.2,1.5,.7,.12,C.green);
  blob(1.2,.95,.2,.16,C.green);blob(-1.0,1.3,.1,.14,C.green);
  blob(.7,0,1.05,.15,C.green);blob(-.6,0,1.0,.12,C.green);
  box(1.8,0,-.4,.07,2.9,.07,C.dblue,{hatch:8});box(1.8,2.45,-.4,.6,.05,.05,C.dblue,{hatch:0});box(1.8,2.1,-.4,.45,.05,.05,C.dblue,{hatch:0});
  box(1.6,0,-2.6,.07,3.2,.07,C.dblue,{hatch:8});box(1.6,2.75,-2.6,.6,.05,.05,C.dblue,{hatch:0});
  [-.27,0,.27].forEach((o,i)=>{wire(V(1.8+o,2.45,-.4),V(1.6+o,2.75,-2.6),.2);wire(V(1.8+o,2.45,-.4),V(.55,2.1-i*.12,.1),.25)});
  wire(V(1.8,2.1,-.4),V(.5,1.4,.5),.3);
  scribbles(6,1.1,2);
  sched(P);
}
function houseCottage(){
  newPart('Rumah Kebun');
  box(0,0,0,1.8,.9,1.2,[C.white,C.white,C.white,C.white,C.cream,C.white],{hatch:5});
  const y=.9,R0=V(-.5,1.7,0),R1=V(.5,1.7,0);
  poly(C.red,[V(-1.05,y,.75),V(1.05,y,.75),R1,R0]);poly(C.dred,[V(1.05,y,-.75),V(-1.05,y,-.75),R0,R1]);
  poly(C.dred,[V(-1.05,y,-.75),V(-1.05,y,.75),R0]);poly(C.red,[V(1.05,y,.75),V(1.05,y,-.75),R1]);
  rectF(-.17,.17,0,.68,.602,C.wood);
  [-.58,.58].forEach(x=>winFront(x,.52,.602,.34,.34,C.sky));
  box(.55,1.25,-.2,.22,.6,.22,C.brick,{hatch:3});
  box(0,0,.85,1.0,.07,.5,C.wood,{hatch:2});
  box(-.45,0,1.05,.06,.78,.06,C.wood,{hatch:0});box(.45,0,1.05,.06,.78,.06,C.wood,{hatch:0});
  poly(C.red,[V(-.55,.82,1.12),V(.55,.82,1.12),V(.55,.98,.6),V(-.55,.98,.6)]);
  blob(-1.1,0,.8,.2,C.green);blob(1.15,0,.8,.18,C.green);
  [[-.8,1.0],[.8,1.05],[1.3,.5],[-1.3,.5]].forEach(([x,z],i)=>blob(x,0,z,.07,[0xff8fb1,0xffd54a,0xe53935,0xffffff][i],1));
  scribbles(6,1.2,2);
  sched(P);
}
function houseVilla(){
  newPart('Villa Modern');
  box(0,0,0,2.0,1.0,1.1,[C.white,C.white,C.white,C.white,C.cream,C.white],{hatch:4});
  box(-.25,1.0,-.05,1.4,.9,.9,[C.blue,C.white,C.white,C.white,C.white,C.white],{hatch:4});
  box(0,.96,0,2.14,.05,1.24,C.gray,{hatch:0});

function drawStrokes(p,tt){for(const s of p.strokes){const k=clamp((tt-s.start)/s.dur);s.g.setDrawRange(0,Math.floor(ease(k)*s.n))}}
function bake(p){ // gabung semua garis jadi satu objek supaya ringan

  for(const s of p.strokes){const a=s.g.attributes.position.array;for(let i=0;i<s.n-1;i++)pos.push(a[i*3],a[i*3+1],a[i*3+2],a[i*3+3],a[i*3+4],a[i*3+5])}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const ls=new THREE.LineSegments(g,lineMat);ls.frustumCulled=false;p.g.add(ls);

}

const zee=V(0,0,1),eul=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
let gyro=false,ori={a:0,b:0,g:0},yaw=0,pitch=0;
function onOri(e){if(e.alpha==null||e.beta==null)return;gyro=true;ori.a=rad(e.alpha);ori.b=rad(e.beta);ori.g=rad(e.gamma)}
function screenAngle(){return rad((screen.orientation&&screen.orientation.angle)||window.orientation||0)}
function updateCamQuat(){
  if(gyro){
    eul.set(ori.b,ori.a,-ori.g,'YXZ');camera.quaternion.setFromEuler(eul);
    camera.quaternion.multiply(q1);camera.quaternion.multiply(q0.setFromAxisAngle(zee,-screenAngle()));

}
async function startCamera(){

}

/* ---------- toast / lokasi ---------- */
let toastT=0;
function toast(msg,ms=3200){
  const h=$('hint');h.textContent=msg;h.classList.remove('hide');clearTimeout(toastT);
  toastT=setTimeout(()=>{if(placed&&!relocating)h.classList.add('hide')},ms);
}
const fwdFlat=()=>{const v=V(0,0,-1).applyQuaternion(camera.quaternion);v.y=0;if(v.lengthSq()<1e-4)return V(0,0,-1);return v.normalize()};
function place(){
  const f=fwdFlat(),p=camera.position.clone().addScaledVector(f,3.2);
  root.position.set(p.x,-1.35,p.z);
  root.rotation.y=Math.atan2(camera.position.x-p.x,camera.position.z-p.z)+.5;

/* ---------- palet & pena ---------- */
const PCOL=['#e53935','#fb8c00','#fdd835','#43a047','#26a69a','#1e88e5','#90caf9','#8e24aa','#f48fb1','#8d6e63','#ffffff','#111111'];
let penColor=PCOL[0],cur=null,gest=null,tweens=[];
const undoStack=[],paintList=[];
const paintGroup=new THREE.Group();scene.add(paintGroup);
PCOL.forEach((c,i)=>{
  const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;
  b.onclick=()=>{penColor=c;[...$('pal').querySelectorAll('.sw')].forEach(x=>x.classList.toggle('on',x===b))};
  $('pal').insertBefore(b,$('psize'));
});
const ray=new THREE.Raycaster();
function setRay(e){
  const r=cv.getBoundingClientRect();
  ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height)*2+1},camera);
}
function activeMeshes(){const a=[];for(const p of parts)if(p.on)for(const m of p.fills)a.push(m);return a}
const matsOf=m=>Array.isArray(m.material)?m.material:[m.material];
function refreshVis(mesh){mesh.visible=matsOf(mesh).some(x=>x.opacity>.001)}

// --- warnai region (gesek) ---
function fillAt(e){
  if(!gest)return;
  setRay(e);
  const h=ray.intersectObjects(activeMeshes(),false)[0];if(!h)return;
  const mat=matsOf(h.object)[h.face&&h.face.materialIndex||0];if(!mat)return;
  if(mat.opacity>.9&&mat.color.getHexString()===new THREE.Color(penColor).getHexString())return;
  gest.batch.push({m:mat,mesh:h.object,c:mat.color.clone(),o:mat.opacity});
  tweens=tweens.filter(w=>w.m!==mat);
  mat.color.set(penColor);mat.opacity=.96;mat.depthWrite=true;h.object.visible=true;
}
function autoColor(){
  const items=[];let i=0;
  for(const p of parts)if(p.on)for(const mesh of p.fills)matsOf(mesh).forEach(m=>{
    items.push({m,mesh,c:m.color.clone(),o:m.opacity});
    tweens=tweens.filter(w=>w.m!==m);
    tweens.push({m,mesh,from:m.opacity,t:-((i++)%45)*.03-rnd()*.2});
    m.color.set(m.userData.def);mesh.visible=true;
  });
  if(items.length)undoStack.push({items});
}

// --- pena bebas 3D ---
function paintPoint(e){
  setRay(e);
  const h=ray.intersectObjects(activeMeshes(),false)[0];
  if(h&&h.distance<14)return h.point.clone().addScaledVector(ray.ray.direction,-.012);
  return ray.ray.origin.clone().addScaledVector(ray.ray.direction,1.6);
}
function wr(c,i,p,s1,s2){
  const a=c.pos.array,o=i*12;
  [[s1,1],[s1,-1],[s2,1],[s2,-1]].forEach(([s,k],j)=>{a[o+j*3]=p.x+s.x*k;a[o+j*3+1]=p.y+s.y*k;a[o+j*3+2]=p.z+s.z*k});
}
function addPt(p){
  const c=cur;if(!c||c.n>=c.MAX-1)return;
  if(c.last&&p.distanceTo(c.last)<.008)return;
  if(c.last){
    const seg=p.clone().sub(c.last).normalize(),view=p.clone().sub(camera.position).normalize();
    const s1=seg.clone().cross(view);if(s1.lengthSq()<1e-6)s1.set(0,1,0);
    s1.normalize().multiplyScalar(c.w/2);
    const s2=seg.clone().cross(s1).normalize().multiplyScalar(c.w/2);
    if(c.n===1)wr(c,0,c.last,s1,s2);
    wr(c,c.n,p,s1,s2);
    const b=(c.n-1)*4,o=(c.n-1)*12,ix=c.idx.array;
    [b,b+1,b+4,b+1,b+5,b+4,b+2,b+3,b+6,b+3,b+7,b+6].forEach((v,k)=>ix[o+k]=v);
    c.g.setDrawRange(0,c.n*12);c.idx.needsUpdate=true;c.pos.needsUpdate=true;
  }

}
function startPaint(e){
  const MAX=2500,g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(MAX*12),3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(MAX*12),1));
  g.setDrawRange(0,0);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:penColor,side:THREE.DoubleSide}));
  m.frustumCulled=false;paintGroup.add(m);
  cur={m,g,pos:g.attributes.position,idx:g.index,n:0,last:null,w:$('psize').value/1000,MAX};
  paintList.push(cur);addPt(paintPoint(e));
}
const rmPaint=s=>{paintGroup.remove(s.m);s.g.dispose();s.m.material.dispose();const i=paintList.indexOf(s);if(i>=0)paintList.splice(i,1)};

function beginGesture(e){
  if(tool==='pen')startPaint(e);
  else{gest={batch:[]};fillAt(e)}
}
function endGesture(){
  if(cur){if(cur.n===1)addPt(cur.last.clone().add(V(.012,0,0)));undoStack.push({s:cur});cur=null}
  if(gest){if(gest.batch.length)undoStack.push({items:gest.batch});gest=null}
}

/* ---------- sentuhan ---------- */
const ptrs=new Map(),cv=$('gl');
let tapStart=null,pinch0=0,scale0=1,lastDrag=null,lookDrag=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    endGesture();const [a,b]=[...ptrs.values()];
    pinch0=Math.hypot(a.x-b.x,a.y-b.y);scale0=modelScale;tapStart=null;return;
  }
  if(ptrs.size!==1)return;
  lastDrag={x:e.clientX,y:e.clientY};
  const look=!gyro&&(e.shiftKey||e.button===2);
  lookDrag=look||!placed||relocating;
  if(started&&placed&&!relocating&&!look){beginGesture(e);return}
  tapStart={x:e.clientX,y:e.clientY,t:performance.now()};
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(cur){addPt(paintPoint(e));return}
  if(gest){fillAt(e);return}
  if(ptrs.size===2&&pinch0){
    const [a,b]=[...ptrs.values()];modelScale=clamp(scale0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,.3,5);root.scale.setScalar(modelScale);
  }else if(ptrs.size===1&&!gyro&&lastDrag&&lookDrag){
    yaw-=(e.clientX-lastDrag.x)*.005;pitch=clamp(pitch-(e.clientY-lastDrag.y)*.005,-1.4,1.4);
    lastDrag={x:e.clientX,y:e.clientY};
  }
});
const endP=e=>{
  if(cur||gest){endGesture();ptrs.delete(e.pointerId);return}
  if(tapStart&&ptrs.size===1&&started){
    const d=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
    if(d<8&&performance.now()-tapStart.t<450&&(!placed||relocating))place();
  }
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;tapStart=null;
};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);

/* ---------- joystick (berjalan) ---------- */
const pad=$('pad'),knob=$('knob');let jv={x:0,y:0},jid=null;
function jmove(e){
  const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width/2-8;
  let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m}
  knob.style.transform=`translate(${dx}px,${dy}px)`;jv={x:dx/max,y:dy/max};
}
function jend(){jid=null;jv={x:0,y:0};knob.style.transform=''}
$('joy').addEventListener('pointerdown',e=>{jid=e.pointerId;$('joy').setPointerCapture(e.pointerId);jmove(e)});
$('joy').addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
$('joy').addEventListener('pointerup',e=>{if(e.pointerId===jid)jend()});
$('joy').addEventListener('pointercancel',jend);

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  updateCamQuat();
  if(jv.x||jv.y){
    const f=fwdFlat(),r=V(-f.z,0,f.x),sp=1.6;
    camera.position.addScaledVector(f,-jv.y*sp*dt).addScaledVector(r,jv.x*sp*dt);
    camera.position.x=clamp(camera.position.x,-12,12);camera.position.z=clamp(camera.position.z,-12,12);
  }
  for(const p of parts)if(p.drawing){
    const tt=clock-p.t0;drawStrokes(p,tt);
    if(tt>DRAW_T+1.2){bake(p);p.drawing=false}
  }
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i];w.t+=dt;if(w.t<0)continue;
    const k=clamp(w.t/.4);w.m.opacity=w.from+(.96-w.from)*k;w.m.depthWrite=w.m.opacity>.5;
    if(k>=1)tweens.splice(i,1);
  }
  const f=V(0,0,-1).applyQuaternion(camera.quaternion);
  const hd=(Math.round(Math.atan2(f.x,-f.z)*180/Math.PI)+360)%360,pt=Math.round(Math.asin(clamp(f.y,-1,1))*180/Math.PI);
  $('deg').textContent=hd+'° '+pt+'°';
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
})();
</script>
