<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sketsa AR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#d9d6e6;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#efeaf7,#cfd6ea)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(140,130,185,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:0}
#back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;padding:5px 12px;border-radius:14px;font-size:12px;z-index:5}
#bar{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;z-index:5}
#bar button{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.25);color:#fff;border:0;display:grid;place-items:center;padding:0}
#bar button:active{background:rgba(255,255,255,.5)}
#bar svg{width:18px;height:18px;fill:#fff}
#joy{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:112px;padding:8px 8px 6px;border-radius:20px;z-index:5;touch-action:none}
#pad{position:relative;width:96px;height:96px;border-radius:50%;background:rgba(40,35,80,.35);margin:0 auto}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#deg{text-align:center;font-size:9px;margin-top:5px;letter-spacing:.4px}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);padding:7px 16px;border-radius:14px;font-size:13px;z-index:5;white-space:nowrap}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#f5f1ff,#c8d0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#2a2f5e}
#start h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}
#start p{margin:0 0 26px;max-width:300px;font-size:14px;line-height:1.5;opacity:.8}
#start button{padding:14px 40px;border:0;border-radius:28px;background:#4a63d8;color:#fff;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(74,99,216,.4)}
#err{margin-top:16px;font-size:12px;color:#b3261e;max-width:300px}
.hide{display:none!important}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<button id="back" class="glass">‹ Ulang</button>
<div id="bar" class="glass">
  <button id="bRelocate" title="Pindah lokasi"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></button>
  <button id="bPlay" title="Putar / Jeda"><svg viewBox="0 0 24 24" id="icoPlay"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
  <button id="bStop" title="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
</div>
<div id="joy" class="glass">
  <div id="pad"><div id="knob"></div></div>
  <div id="deg">0° 0°</div>
</div>
<div id="hint" class="glass">Ketuk layar untuk menaruh lokasi</div>

<div id="start">
  <h1>SKETSA AR</h1>
  <p>Sketsa rumah 3D yang digambar garis demi garis lalu diwarnai, tepat di ruangan Anda. Arahkan kamera, ketuk untuk menaruh, lalu berjalan mengelilinginya.</p>
  <button id="go">Mulai</button>
  <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const rad=d=>d*Math.PI/180, clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ---------- renderer ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(62,1,.05,100);
scene.add(camera);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- model sketsa ---------- */
const root=new THREE.Group();root.visible=false;scene.add(root);
const strokes=[],fills=[];
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const J=a=>(rnd()-.5)*2*a;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const INK=0x23233a;
const lineMat=new THREE.LineBasicMaterial({color:INK,transparent:true,opacity:.92});
const C={white:0xf7f5ff,blue:0x8d9df3,dblue:0x3f58d6,red:0xdc4a2c,dred:0xa83520,green:0x6cc24a,win:0x2c43c0};
const fm=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});

function polyline(pts,jit=.01,seg=8){
  const o=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],n=Math.max(2,Math.round(a.distanceTo(b)*seg));
    for(let k=i?1:0;k<=n;k++){const t=k/n;o.push(a.x+(b.x-a.x)*t+J(jit),a.y+(b.y-a.y)*t+J(jit),a.z+(b.z-a.z)*t+J(jit))}
  }
  return o;
}
function addStroke(flat){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(flat,3));
  g.setDrawRange(0,0);
  const l=new THREE.Line(g,lineMat);l.frustumCulled=false;root.add(l);
  strokes.push({g,n:flat.length/3,start:0,dur:1});
}
function edge(a,b){ // coretan dua kali + overshoot
  const d=b.clone().sub(a).normalize().multiplyScalar(.035);
  addStroke(polyline([a.clone().sub(d),b.clone().add(d)],.008));
  if(rnd()<.55)addStroke(polyline([a.clone().add(d.clone().multiplyScalar(-.4)),b.clone().sub(d.clone().multiplyScalar(.3))],.012));
}
function outline(pts){for(let i=0;i<pts.length;i++)edge(pts[i],pts[(i+1)%pts.length])}

function box(cx,cy,cz,w,h,d,cols,opt={}){
  const x0=cx-w/2,x1=cx+w/2,y0=cy,y1=cy+h,z0=cz-d/2,z1=cz+d/2,P=V;
  if(cols){
    const mats=cols.map(c=>fm(c));
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats);
    m.position.set(cx,cy+h/2,cz);m.visible=false;root.add(m);fills.push({mats,mesh:m});
  }
  const c=[P(x0,y0,z0),P(x1,y0,z0),P(x1,y0,z1),P(x0,y0,z1),P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>edge(c[a],c[b]));
  const hat=opt.hatch===undefined?Math.floor(h*4):opt.hatch;
  for(let i=0;i<hat;i++){
    const y=y0+.05+rnd()*h*.85,za=z0+d*(.1+rnd()*.25),zb=z1-d*(.1+rnd()*.25);
    addStroke(polyline([P(x1,y,za),P(x1,y+.1,zb)],.004,4));
  }
}
function poly(color,pts,fill=true){
  if(fill){
    const g=new THREE.BufferGeometry(),v=[];
    for(let i=1;i<pts.length-1;i++)[pts[0],pts[i],pts[i+1]].forEach(p=>v.push(p.x,p.y,p.z));
    g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
    const mat=fm(color),m=new THREE.Mesh(g,mat);m.visible=false;root.add(m);fills.push({mats:[mat],mesh:m});
  }
  outline(pts);
}
function circleFront(cx,cy,z,r,color){
  const pts=[];for(let i=0;i<=28;i++){const a=i/28*Math.PI*2;pts.push(V(cx+Math.cos(a)*r,cy+Math.sin(a)*r,z))}
  addStroke(polyline(pts,.004,10));
  const mat=fm(color),m=new THREE.Mesh(new THREE.CircleGeometry(r,28),mat);
  m.position.set(cx,cy,z-.001);m.visible=false;root.add(m);fills.push({mats:[mat],mesh:m});
}
function winFront(cx,cy,z,w,h){
  poly(C.win,[V(cx-w/2,cy-h/2,z),V(cx+w/2,cy-h/2,z),V(cx+w/2,cy+h/2,z),V(cx-w/2,cy+h/2,z)]);
  for(let i=1;i<3;i++){const x=cx-w/2+w*i/3;addStroke(polyline([V(x,cy-h/2,z+.002),V(x,cy+h/2,z+.002)],.003,6))}
}
function winRight(x,cy,cz,w,h){
  poly(C.win,[V(x,cy-h/2,cz-w/2),V(x,cy-h/2,cz+w/2),V(x,cy+h/2,cz+w/2),V(x,cy+h/2,cz-w/2)]);
}
function bush(x,y,z,r){
  const mat=fm(C.green),m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),mat);
  m.position.set(x,y+r*.8,z);m.visible=false;root.add(m);fills.push({mats:[mat],mesh:m});
  for(let k=0;k<3;k++){
    const pts=[];const ph=rnd()*6;
    for(let i=0;i<=16;i++){const a=ph+i/16*Math.PI*2*1.1;pts.push(V(x+Math.cos(a)*r*(.6+k*.2),y+r*.8+Math.sin(a*.7+k)*r*.5,z+Math.sin(a)*r*(.6+k*.2)))}
    addStroke(polyline(pts,.01,10));
  }
  const pot=[V(x-r*.4,y,z),V(x+r*.4,y,z),V(x+r*.3,y+r*.35,z),V(x-r*.3,y+r*.35,z)];outline(pot);
}
function wire(a,b,sag=.18){
  const pts=[];for(let i=0;i<=14;i++){const t=i/14;pts.push(V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t-Math.sin(Math.PI*t)*sag,a.z+(b.z-a.z)*t))}
  addStroke(polyline(pts,.004,3));
}

function buildModel(){
  // menara utama
  box(0,0,0,1.0,2.1,.9,[C.blue,C.white,C.white,C.white,C.white,C.white],{hatch:12});
  // atap pelana menara
  const y=2.1,rh=.55,A=V(-.6,y,-.55),B=V(.6,y,-.55),Cc=V(.6,y,.55),D=V(-.6,y,.55),R0=V(-.6,y+rh,0),R1=V(.6,y+rh,0);
  poly(C.red,[D,Cc,R1,R0]);poly(C.dred,[B,A,R0,R1]);
  poly(C.white,[A,D,R0]);poly(C.blue,[Cc,B,R1]);
  // jendela menara
  circleFront(0,1.72,.452,.17,C.win);
  winFront(-.22,1.1,.452,.2,.34);winFront(.2,1.1,.452,.2,.34);winFront(0,.55,.452,.22,.28);
  [[.5,1.6],[.5,1.0],[.5,.45]].forEach(([_,yy],i)=>{winRight(.502,yy,i%2?-.15:.15,.2,.3)});
  // rumah samping kiri + atap miring
  box(-1.0,0,.15,.9,1.0,.8,[C.white,C.white,C.white,C.white,C.white,C.white],{hatch:3});
  poly(C.red,[V(-1.55,1.0,-.3),V(-.5,1.32,-.3),V(-.5,1.32,.6),V(-1.55,1.0,.6)]);
  poly(C.white,[V(-1.2,.35,.552),V(-.8,.35,.552),V(-.8,.9,.552),V(-1.2,.9,.552)]);
  // rumah samping kanan
  box(1.0,0,.2,.9,.75,.8,[C.blue,C.white,C.white,C.white,C.white,C.white],{hatch:3});
  poly(C.red,[V(.5,.75,-.25),V(1.55,.95,-.25),V(1.55,.95,.65),V(.5,.75,.65)]);
  poly(C.dred,[V(.6,.5,.62),V(1.4,.5,.62),V(1.4,.62,.85),V(.6,.62,.85)]);
  // balkon & tanaman
  box(0,1.45,.62,.9,.05,.3,[C.dblue,C.dblue,C.dblue,C.dblue,C.dblue,C.dblue],{hatch:0});
  bush(-.25,1.5,.68,.14);bush(.2,1.5,.7,.12);
  bush(1.2,.95,.2,.16);bush(-1.0,1.3,.1,.14);
  bush(.7,0,1.05,.15);bush(-.6,0,1.0,.12);bush(1.5,0,.75,.1);
  // tiang listrik
  const BL=[C.dblue,C.dblue,C.dblue,C.dblue,C.dblue,C.dblue];
  box(1.8,0,-.4,.07,2.9,.07,BL,{hatch:8});box(1.8,2.45,-.4,.6,.05,.05,BL,{hatch:0});box(1.8,2.1,-.4,.45,.05,.05,BL,{hatch:0});
  box(1.6,0,-2.6,.07,3.2,.07,BL,{hatch:8});box(1.6,2.75,-2.6,.6,.05,.05,BL,{hatch:0});
  [-.27,0,.27].forEach((o,i)=>{
    wire(V(1.8+o,2.45,-.4),V(1.6+o,2.75,-2.6),.2);
    wire(V(1.8+o,2.45,-.4),V(.55,2.1-i*.12,.1),.25);
  });
  wire(V(1.8,2.1,-.4),V(.5,1.4,.5),.3);wire(V(1.6,2.75,-2.6),V(-1.5,1.3,.1),.5);
  // latar sketsa tanpa warna
  const faint=(x,z,w,h,d)=>{
    box(x,0,z,w,h,d,null,{hatch:2});
    outline([V(x-w/2-.05,h,z+d/2+.05),V(x+w/2+.05,h,z+d/2+.05),V(x,h+.4,z+d/2+.05)]);
  };
  faint(-2.4,-1.4,.8,1.5,.8);faint(2.7,1.0,.7,1.2,.7);faint(-2.8,1.4,.6,.9,.6);
  // coretan tanah
  for(let i=0;i<14;i++){
    const a=rnd()*Math.PI*2,r=.9+rnd()*1.6,l=.3+rnd()*.7;
    addStroke(polyline([V(Math.cos(a)*r,.005,Math.sin(a)*r),V(Math.cos(a+l/r)*r,.005,Math.sin(a+l/r)*r)],.02,5));
  }
  // jadwal animasi
  const N=strokes.length,LT=10;
  strokes.forEach((s,i)=>{s.start=(i/N)*(LT-1.2)+J(.15);s.dur=.7+rnd()*.7;if(s.start<0)s.start=0});
  fills.forEach((f,i)=>{f.start=LT-1+i*.32;f.dur=1.1});
}
buildModel();
const TOTAL=Math.max(...fills.map(f=>f.start+f.dur))+3.5;

function apply(t){
  for(const s of strokes){
    const p=clamp((t-s.start)/s.dur);
    s.g.setDrawRange(0,Math.floor(ease(p)*s.n));
  }
  for(const f of fills){
    const o=ease(clamp((t-f.start)/f.dur));
    f.mesh.visible=o>0.001;
    f.mats.forEach(m=>m.opacity=o*.96);
  }
}

/* ---------- state ---------- */
let t=0,playing=true,placed=false,started=false,modelScale=1;
apply(0);

/* ---------- kamera & orientasi ---------- */
const zee=V(0,0,1),eul=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
let gyro=false,ori={a:0,b:0,g:0},yaw=0,pitch=0;
function onOri(e){if(e.alpha==null||e.beta==null)return;gyro=true;ori.a=rad(e.alpha);ori.b=rad(e.beta);ori.g=rad(e.gamma)}
function screenAngle(){return rad((screen.orientation&&screen.orientation.angle)||window.orientation||0)}
function updateCamQuat(){
  if(gyro){
    eul.set(ori.b,ori.a,-ori.g,'YXZ');camera.quaternion.setFromEuler(eul);
    camera.quaternion.multiply(q1);camera.quaternion.multiply(q0.setFromAxisAngle(zee,-screenAngle()));
  }else{
    camera.rotation.set(pitch,yaw,0,'YXZ');
  }
}
async function startCamera(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    $('cam').srcObject=s;await $('cam').play().catch(()=>{});
  }catch(e){ $('err').textContent='Kamera tidak bisa diakses ('+(e.name||'error')+'). Mode tanpa kamera dipakai; seret layar untuk melihat sekeliling.' }
}
$('go').onclick=async()=>{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{await DeviceOrientationEvent.requestPermission()}catch(e){}
  }
  addEventListener('deviceorientation',onOri,true);
  await startCamera();
  $('start').classList.add('hide');started=true;
};

/* ---------- taruh lokasi, geser, cubit ---------- */
const fwdFlat=()=>{const v=V(0,0,-1).applyQuaternion(camera.quaternion);v.y=0;if(v.lengthSq()<1e-4)return V(0,0,-1);return v.normalize()};
function place(){
  const f=fwdFlat(),p=camera.position.clone().addScaledVector(f,3);
  root.position.set(p.x,-1.35,p.z);
  root.rotation.y=Math.atan2(camera.position.x-p.x,camera.position.z-p.z)+.6;
  root.visible=true;placed=true;t=0;apply(0);playing=true;setPlayIcon();
  $('hint').classList.add('hide');
}
const ptrs=new Map();let tapStart=null,pinch0=0,scale0=1,lastDrag=null;
const cv=$('gl');
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){tapStart={x:e.clientX,y:e.clientY,t:performance.now()};lastDrag={x:e.clientX,y:e.clientY}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);scale0=modelScale;tapStart=null}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch0){
    const [a,b]=[...ptrs.values()];modelScale=clamp(scale0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,.3,5);root.scale.setScalar(modelScale);
  }else if(ptrs.size===1&&!gyro&&lastDrag){
    yaw-=(e.clientX-lastDrag.x)*.005;pitch=clamp(pitch-(e.clientY-lastDrag.y)*.005,-1.4,1.4);
    lastDrag={x:e.clientX,y:e.clientY};
  }
});
const endP=e=>{
  if(tapStart&&ptrs.size===1&&started){
    const d=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
    if(d<8&&performance.now()-tapStart.t<450&&(!placed||relocating)){place();relocating=false}
  }
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;tapStart=null;
};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);

/* ---------- tombol ---------- */
let relocating=false;
function setPlayIcon(){$('icoPlay').innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4l13 8-13 8z"/>'}
function relocate(){relocating=true;root.visible=false;$('hint').classList.remove('hide');$('hint').textContent='Ketuk layar untuk menaruh lokasi'}
$('bRelocate').onclick=relocate;
$('back').onclick=()=>{placed=false;relocate();t=0;apply(0);modelScale=1;root.scale.setScalar(1);camera.position.set(0,0,0)};
$('bPlay').onclick=()=>{if(!placed)return;playing=!playing;setPlayIcon()};
$('bStop').onclick=()=>{t=0;apply(0);playing=false;setPlayIcon()};

/* ---------- joystick (berjalan) ---------- */
const pad=$('pad'),knob=$('knob');let jv={x:0,y:0},jid=null;
function jmove(e){
  const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width/2-8;
  let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>max){dx*=max/m;dy*=max/m}
  knob.style.transform=`translate(${dx}px,${dy}px)`;jv={x:dx/max,y:dy/max};
}
function jend(){jid=null;jv={x:0,y:0};knob.style.transform=''}
$('joy').addEventListener('pointerdown',e=>{jid=e.pointerId;$('joy').setPointerCapture(e.pointerId);jmove(e)});
$('joy').addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
$('joy').addEventListener('pointerup',e=>{if(e.pointerId===jid)jend()});
$('joy').addEventListener('pointercancel',jend);

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  updateCamQuat();
  if(jv.x||jv.y){
    const f=fwdFlat(),r=V(-f.z,0,f.x),sp=1.6;
    camera.position.addScaledVector(f,-jv.y*sp*dt).addScaledVector(r,jv.x*sp*dt);
    camera.position.x=clamp(camera.position.x,-10,10);camera.position.z=clamp(camera.position.z,-10,10);
  }
  if(placed&&playing){
    t+=dt;if(t>TOTAL){t=0}
    apply(t);
  }
  const f=V(0,0,-1).applyQuaternion(camera.quaternion);
  const hd=(Math.round(Math.atan2(f.x,-f.z)*180/Math.PI)+360)%360,pt=Math.round(Math.asin(clamp(f.y,-1,1))*180/Math.PI);
  $('deg').textContent=hd+'° '+pt+'°';
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
})();
</script>
